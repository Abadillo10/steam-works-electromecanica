<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title desc"><title id="title">Viscosidad entre placas paralelas</title><desc id="desc">Una placa superior se mueve a 2 metros por segundo sobre una película de aceite de un milímetro. La placa inferior está fija y el perfil de velocidad es lineal.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1976d2"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#a6bad0" stroke-width="1"/></pattern></defs><style>text{font-family:Segoe UI,Arial,sans-serif;font-size:17px;fill:#12345b}.title{font-size:21px;font-weight:600}.note{font-size:15px;fill:#526477}.wall{fill:none;stroke:#12345b;stroke-width:3;stroke-linejoin:round}.liquid{fill:#dcecfb}.surface{fill:none;stroke:#1976d2;stroke-width:2}.arrow{fill:none;stroke:#1976d2;stroke-width:2;marker-end:url(#tip)}.guide{fill:none;stroke:#a6bad0;stroke-width:1.5;stroke-dasharray:5 5}</style><rect width="640" height="320" rx="10" fill="#f7faff"/><text x="24" y="33" class="title">Viscosidad entre placas paralelas</text><path d="M24 49H616" stroke="#dce6ef"/><rect x="90" y="91" width="410" height="19" fill="url(#hatch)" stroke="#12345b" stroke-width="2"/><rect x="90" y="230" width="410" height="19" fill="url(#hatch)" stroke="#12345b" stroke-width="2"/><rect x="90" y="111" width="410" height="118" class="liquid"/><path d="M250 230L410 110" class="surface"/><path d="M275 80L460 80" class="arrow"/><text x="281" y="67" >U = 2.0 m/s</text><path d="M250 200L290 200" class="arrow"/><path d="M250 170L330 170" class="arrow"/><path d="M250 140L370 140" class="arrow"/><path d="M250 112V230" class="guide"/><text x="112" y="168" >Aceite</text><text x="112" y="193" >μ = 0.140 Pa·s</text><path d="M520 110H560M520 230H560M548 110V230" class="surface"/><text x="557" y="173" >h</text><text x="88" y="276" >Placa inferior fija</text><text x="343" y="276" >h = 1.00 mm</text><text x="88" y="304" class="note">Perfil lineal: du/dy = U/h · Sin deslizamiento en las paredes.</text></svg>