<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title desc"><title id="title">Mismo peso, distinto volumen</title><desc id="desc">Dos muestras ideales tienen el mismo peso de 47 kilonewtons y volúmenes de 3 y 6 metros cúbicos. La de menor volumen tiene mayor densidad.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1976d2"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#a6bad0" stroke-width="1"/></pattern></defs><style>text{font-family:Segoe UI,Arial,sans-serif;font-size:17px;fill:#12345b}.title{font-size:21px;font-weight:600}.note{font-size:15px;fill:#526477}.wall{fill:none;stroke:#12345b;stroke-width:3;stroke-linejoin:round}.liquid{fill:#dcecfb}.surface{fill:none;stroke:#1976d2;stroke-width:2}.arrow{fill:none;stroke:#1976d2;stroke-width:2;marker-end:url(#tip)}.guide{fill:none;stroke:#a6bad0;stroke-width:1.5;stroke-dasharray:5 5}</style><rect width="640" height="320" rx="10" fill="#f7faff"/><text x="24" y="33" class="title">Mismo peso, distinto volumen</text><path d="M24 49H616" stroke="#dce6ef"/><path d="M95 100V245H200V100" class="wall"/><path d="M98 145H197V242H98Z" class="liquid"/><path d="M98 145H197" class="surface"/><path d="M345 100V245H555V100" class="wall"/><path d="M348 145H552V242H348Z" class="liquid"/><path d="M348 145H552" class="surface"/><text x="88" y="84" >Muestra A</text><text x="348" y="84" >Muestra B</text><text x="108" y="183" >3 m³</text><text x="420" y="183" >6 m³</text><text x="86" y="268" >W = 47 kN</text><text x="375" y="268" >W = 47 kN</text><text x="62" y="304" class="note">ρ = W / (gV) · Al duplicar V con W fijo, ρ se reduce a la mitad.</text></svg>