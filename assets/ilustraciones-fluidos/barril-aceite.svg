<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title desc"><title id="title">Barril: separar el recipiente del aceite</title><desc id="desc">Un recipiente vacío pesa 110 N. El recipiente lleno contiene 0.159 metros cúbicos de aceite. El peso total incluye ambas contribuciones.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1976d2"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#a6bad0" stroke-width="1"/></pattern></defs><style>text{font-family:Segoe UI,Arial,sans-serif;font-size:17px;fill:#12345b}.title{font-size:21px;font-weight:600}.note{font-size:15px;fill:#526477}.wall{fill:none;stroke:#12345b;stroke-width:3;stroke-linejoin:round}.liquid{fill:#dcecfb}.surface{fill:none;stroke:#1976d2;stroke-width:2}.arrow{fill:none;stroke:#1976d2;stroke-width:2;marker-end:url(#tip)}.guide{fill:none;stroke:#a6bad0;stroke-width:1.5;stroke-dasharray:5 5}</style><rect width="640" height="320" rx="10" fill="#f7faff"/><text x="24" y="33" class="title">Barril: separar el recipiente del aceite</text><path d="M24 49H616" stroke="#dce6ef"/><path d="M80 100V250H210V100" class="wall"/><path d="M83 250H207V247H83Z" class="liquid"/><path d="M83 250H207" class="surface"/><text x="86" y="85" >Recipiente vacío</text><text x="92" y="211" >110 N</text><path d="M360 100V250H510V100" class="wall"/><path d="M363 135H507V247H363Z" class="liquid"/><path d="M363 135H507" class="surface"/><text x="366" y="85" >Barril lleno</text><text x="375" y="175" >Aceite</text><text x="370" y="200" >V = 0.159 m³</text><path d="M285 160L335 160" class="arrow"/><text x="246" y="139" >+ aceite</text><text x="75" y="280" >Waceite = Wtotal − 110 N</text><text x="75" y="305" class="note">Al variar ρ con V fijo, cambia el peso total.</text></svg>