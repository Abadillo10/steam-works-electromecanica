<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title desc"><title id="title">Gato hidráulico: palanca y ley de Pascal</title><desc id="desc">Corte esquemático: una fuerza de 100 newtons actúa a 30 centímetros del pistón pequeño. El apoyo C está a otros 3 centímetros. El diámetro del pistón pequeño es 1.5 centímetros y el del grande 5 centímetros.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1976d2"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#a6bad0" stroke-width="1"/></pattern><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#eaf0f6" stroke-width=".5"/></pattern><linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e7f4ff"/><stop offset="1" stop-color="#a9d0f1"/></linearGradient><linearGradient id="metal"><stop stop-color="#cad6e1"/><stop offset=".45" stop-color="#f7fafc"/><stop offset="1" stop-color="#a7b8c9"/></linearGradient><linearGradient id="insect"><stop stop-color="#132c46"/><stop offset=".45" stop-color="#55768c"/><stop offset=".65" stop-color="#1a3c57"/><stop offset="1" stop-color="#0b2035"/></linearGradient></defs><style>text{font-family:Segoe UI,Arial,sans-serif;font-size:17px;fill:#12345b}.title{font-size:21px;font-weight:600}.note{font-size:15px;fill:#526477}.wall{fill:none;stroke:#12345b;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.liquid{fill:url(#water)}.metal{fill:url(#metal);stroke:#12345b;stroke-width:2}.surface{fill:none;stroke:#1976d2;stroke-width:2}.arrow{fill:none;stroke:#1976d2;stroke-width:2;marker-end:url(#tip)}.guide{fill:none;stroke:#a6bad0;stroke-width:1.5;stroke-dasharray:5 5}</style><rect width="640" height="320" rx="10" fill="#f9fbfd"/><rect x="20" y="55" width="600" height="223" fill="url(#grid)"/><text x="24" y="33" class="title">Gato hidráulico: palanca y ley de Pascal</text><path d="M24 49H616" stroke="#dce6ef"/><path d="M257 205V273H548V115H476V232H299V205Z" fill="url(#hatch)" stroke="#12345b" stroke-width="2"/><path d="M271 209V258H533V171H490V243H285V209Z" fill="url(#water)" stroke="#1976d2" stroke-width="1.5"/><rect x="476" y="98" width="72" height="73" class="metal"/><rect x="464" y="87" width="96" height="12" class="metal"/><rect x="271" y="188" width="28" height="43" class="metal"/><path d="M65 181H324" stroke="#12345b" stroke-width="8" stroke-linecap="round"/><circle cx="285" cy="181" r="5" fill="white" stroke="#12345b" stroke-width="2"/><circle cx="324" cy="181" r="5" fill="white" stroke="#12345b" stroke-width="2"/><path d="M324 188L312 204H336Z" fill="url(#metal)" stroke="#12345b"/><circle cx="352" cy="249" r="8" fill="white" stroke="#12345b" stroke-width="2"/><path d="M348 244L356 249L348 254Z" fill="#1976d2"/><path d="M65 103L65 169" class="arrow"/><text x="32" y="91" >F = 100 N</text><path d="M512 57L512 80" class="arrow"/><text x="550" y="70" >F₂</text><path d="M65 128V156M285 128V156M324 128V156M65 141H285M285 141H324" class="surface"/><path d="M65 137L65 145M285 137L285 145M324 137L324 145" class="wall"/><text x="145" y="132" >30 cm</text><text x="298" y="118" font-size="15">3 cm</text><text x="277" y="173" font-size="15">B</text><text x="329" y="173" font-size="15">C</text><text x="43" y="216" >d₁ = 1.5 cm</text><path d="M163 211H258" class="guide"/><text x="454" y="206" >d₂ = 5 cm</text><path d="M491 197V174" class="guide"/><text x="311" y="294" class="note">Válvula de retención</text><text x="28" y="315" class="note">Brazos respecto a C: 33 cm y 3 cm. Corte esquemático.</text></svg>