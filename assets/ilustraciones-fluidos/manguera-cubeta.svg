<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title desc"><title id="title">Aforo con cubeta, manguera y boquilla</title><desc id="desc">Una manguera de diámetro 2 centímetros se reduce a una boquilla de 0.8 centímetros. Su descarga llena una cubeta de 10 galones estadounidenses en 50 segundos.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1976d2"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#a6bad0" stroke-width="1"/></pattern><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#eaf0f6" stroke-width=".5"/></pattern><linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e7f4ff"/><stop offset="1" stop-color="#a9d0f1"/></linearGradient><linearGradient id="metal"><stop stop-color="#cad6e1"/><stop offset=".45" stop-color="#f7fafc"/><stop offset="1" stop-color="#a7b8c9"/></linearGradient><linearGradient id="insect"><stop stop-color="#132c46"/><stop offset=".45" stop-color="#55768c"/><stop offset=".65" stop-color="#1a3c57"/><stop offset="1" stop-color="#0b2035"/></linearGradient></defs><style>text{font-family:Segoe UI,Arial,sans-serif;font-size:17px;fill:#12345b}.title{font-size:21px;font-weight:600}.note{font-size:15px;fill:#526477}.wall{fill:none;stroke:#12345b;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.liquid{fill:url(#water)}.metal{fill:url(#metal);stroke:#12345b;stroke-width:2}.surface{fill:none;stroke:#1976d2;stroke-width:2}.arrow{fill:none;stroke:#1976d2;stroke-width:2;marker-end:url(#tip)}.guide{fill:none;stroke:#a6bad0;stroke-width:1.5;stroke-dasharray:5 5}</style><rect width="640" height="320" rx="10" fill="#f9fbfd"/><rect x="20" y="55" width="600" height="223" fill="url(#grid)"/><text x="24" y="33" class="title">Aforo con cubeta, manguera y boquilla</text><path d="M24 49H616" stroke="#dce6ef"/><path d="M35 131H285L335 145V159L285 173H35" fill="#e5ebf2" stroke="#12345b" stroke-width="3"/><path d="M35 142H280L335 150V154L280 162H35" fill="#dcecfb"/><path d="M335 152Q455 150 495 215" fill="none" stroke="#1976d2" stroke-width="6"/><path d="M85 151L180 151" class="arrow"/><text x="62" y="107" >D = 2 cm</text><text x="245" y="87" >Boquilla: d = 0.8 cm</text><path d="M316 94L320 136" class="guide"/><path d="M443 185V270H578V185" class="wall"/><path d="M446 235H575V267H446Z" class="liquid"/><path d="M446 235H575" class="surface"/><path d="M451 240H570" stroke="white" opacity=".8"/><text x="459" y="252" >10 gal EE. UU.</text><text x="433" y="292" >Δt = 50 s</text><text x="47" y="224" >Q = V / Δt</text><text x="47" y="253" >ṁ = ρQ</text><text x="47" y="282" >ūsalida = Q / Aboquilla</text></svg>