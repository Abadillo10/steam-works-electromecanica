<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title desc"><title id="title">Compresión: presión y volumen</title><desc id="desc">Dos estados de un cilindro con pistón muestran que al aumentar la presión disminuye el volumen de una misma masa de líquido. La reducción se exagera para verla.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1976d2"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#a6bad0" stroke-width="1"/></pattern></defs><style>text{font-family:Segoe UI,Arial,sans-serif;font-size:17px;fill:#12345b}.title{font-size:21px;font-weight:600}.note{font-size:15px;fill:#526477}.wall{fill:none;stroke:#12345b;stroke-width:3;stroke-linejoin:round}.liquid{fill:#dcecfb}.surface{fill:none;stroke:#1976d2;stroke-width:2}.arrow{fill:none;stroke:#1976d2;stroke-width:2;marker-end:url(#tip)}.guide{fill:none;stroke:#a6bad0;stroke-width:1.5;stroke-dasharray:5 5}</style><rect width="640" height="320" rx="10" fill="#f7faff"/><text x="24" y="33" class="title">Compresión: presión y volumen</text><path d="M24 49H616" stroke="#dce6ef"/><path d="M75 110V255H245V110" class="wall"/><path d="M78 130H242V252H78Z" class="liquid"/><path d="M78 130H242" class="surface"/><path d="M370 110V255H540V110" class="wall"/><path d="M373 160H537V252H373Z" class="liquid"/><path d="M373 160H537" class="surface"/><rect x="76" y="112" width="168" height="18" fill="#d5dee8" stroke="#12345b" stroke-width="2"/><rect x="371" y="142" width="168" height="18" fill="#d5dee8" stroke="#12345b" stroke-width="2"/><path d="M160 72V112M455 72V142" class="wall"/><path d="M120 73L120 105" class="arrow"/><path d="M415 73L415 132" class="arrow"/><path d="M495 73L495 132" class="arrow"/><text x="191" y="83" >p₁</text><text x="553" y="83" >p₂ &gt; p₁</text><text x="117" y="208" >V₁</text><text x="413" y="217" >V₂ &lt; V₁</text><text x="226" y="282" >Misma masa</text><text x="42" y="307" class="note">ΔV ≈ −V₁Δp/K · Cambio de volumen exagerado para visualizarlo.</text></svg>