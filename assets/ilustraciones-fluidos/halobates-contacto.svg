th="3"/><path d="M462 184L462 112" class="arrow"/><path d="M524 184L524 112" class="arrow"/><path d="M493 166L493 238" class="arrow"/><text x="431" y="100" >Fσ,z</text><text x="524" y="100" >Fσ,z</text><text x="502" y="242" >Peso</text><text x="45" y="306" class="note">Modelo ideal: mg = 2σL · Dos líneas de contacto por tramo de pata.</text></svg>