e">Halobates: apoyo por tensión superficial</text><path d="M24 49H616" stroke="#dce6ef"/><ellipse cx="165" cy="171" rx="135" ry="78" fill="url(#water)" opacity=".7"/><g fill="none" stroke="#1976d2" opacity=".3"><ellipse cx="53" cy="182" rx="25" ry="7"/><ellipse cx="280" cy="182" rx="25" ry="7"/><ellipse cx="83" cy="226" rx="21" ry="6"/><ellipse cx="247" cy="226" rx="21" ry="6"/></g><g stroke="#12345b" stroke-linecap="round" fill="none"><path d="M153 130L127 105L104 110M177 130L203 105L226 110" stroke-width="3"/><path d="M153 145L95 144L53 182M177 145L235 144L280 182M155 164L113 199L83 226M175 164L218 199L247 226" stroke-width="2.5"/><path d="M160 112Q145 89 134 89M170 112Q185 89 196 89" stroke-width="1.5"/></g><g fill="#12345b"><circle cx="95" cy="144" r="3"/><circle cx="235" cy="144" r="3"/><circle cx="113" cy="199" r="3"/><circle cx="218" cy="199" r="3"/></g><ellipse cx="165" cy="164" rx="11" ry="30" fill="url(#insect)" stroke="#12345b"/><ellipse cx="165" cy="137" rx="13" ry="18" fill="url(#insect)" stroke="#12345b"/><ellipse cx="165" cy="115" rx="10" ry="11" fill="url(#insect)" stroke="#12345b"/><path d="M162 152V183" stroke="#a1bccd" stroke-width="1"/><circle cx="158" cy="111" r="2" fill="#071722"/><circle cx="172" cy="111" r="2" fill="#071722"/><path d="M340 70V272" class="guide"/><text x="44" y="78" >Vista superior y apoyos</text><text x="81" y="269" >L = suma de apoyos</text><text x="387" y="78" >Detalle de una pata</text><path d="M365 153Q427 148 462 186Q493 211 524 186Q564 148 610 153L610 254H365Z" class="liquid"/><path d="M365 153Q427 148 462 186Q493 211 524 186Q564 148 610 153" class="surface"/><circle cx="493" cy="166" r="35" fill="url(#metal)" stroke="#12345b" stroke-width="2"/><circle cx="493" cy="166" r="28" fill="none" stroke="#e7eef5"/><path d="M462 184L462 112" class="arrow"/><path d="M524 184L524 112" class="arrow"/><path d="M493 166L493 238" class="arrow"/><text x="431" y="100" >Fσ,z</text><text x="524" y="100" >Fσ,z</text><text x="502" y="242" >